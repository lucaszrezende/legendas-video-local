name: Update feed

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to verify
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: transkript-update-feed
  cancel-in-progress: false

jobs:
  publish-feed:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.draft && !github.event.release.prerelease)
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Read distribution tools
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: main
          persist-credentials: false
      - name: Verify installer and publish compatible version.json
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 tools/sync_release_feed.py "$RELEASE_TAG"
